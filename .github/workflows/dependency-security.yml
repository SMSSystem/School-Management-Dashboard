# Dependency security updates (sms-system/docs/VERSIONING.md, "Dependency security updates").
#
# Run it from Actions → "Dependency security" → "Run workflow", or wait for Monday 06:00 UTC. In sms-system/ it runs
# `npm audit fix`, which updates vulnerable packages only within the version ranges in package.json (never forced),
# runs the tests, lint, tsc and the build, writes Security bullets in CHANGELOG.md, bumps the patch version and opens
# one pull request, "SMS-<n> | Dependency Security Updates". If a check fails, the pull request is a draft. It never
# merges. An open pull request from the deps/security branch is updated instead of opening a second one.
#
# The pull request is opened with the owner's fine-grained token (the DEPS_PR_TOKEN secret), because a pull request
# opened with the built-in token doesn't start the other workflows (Version check, Fallow). That token is used only in
# the last step: packages install and run their scripts earlier, so it's never in the environment or the git config
# while they do.
name: Dependency security

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: dependency-security
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sms-system
    env:
      BRANCH: deps/security
    steps:
      - name: Check the token is set
        working-directory: .
        env:
          PR_TOKEN: ${{ secrets.DEPS_PR_TOKEN }}
        run: |
          if [ -z "$PR_TOKEN" ]; then
            echo "::error::Add the DEPS_PR_TOKEN secret first (sms-system/docs/VERSIONING.md, Dependency security updates)."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sms-system/package-lock.json

      - run: npm ci

      - name: Audit
        id: audit
        run: |
          # npm audit exits non-zero whenever it finds anything, so the report decides: an error report fails this step.
          npm audit --json > "$RUNNER_TEMP/before.json" || true
          count=$(node ../.github/scripts/deps-security.mjs count "$RUNNER_TEMP/before.json")
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Packages with a security advisory: $count" >> "$GITHUB_STEP_SUMMARY"

      - name: Fix within the version ranges
        id: fix
        if: steps.audit.outputs.count != '0'
        run: |
          # npm audit fix exits non-zero while anything is left, so its exit code says nothing; the report after it does.
          npm audit fix || true
          npm audit --json > "$RUNNER_TEMP/after.json" || true
          node ../.github/scripts/deps-security.mjs count "$RUNNER_TEMP/after.json" > /dev/null
          if git diff --quiet -- package.json package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "npm audit fix changed nothing: what is left needs a fix by hand." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Tests, lint, tsc and the build
        id: checks
        if: steps.fix.outputs.changed == 'true'
        run: |
          failed=false
          results=()
          check() {
            local name="$1"; shift
            if "$@"; then results+=("\"$name\": true"); else results+=("\"$name\": false"); failed=true; fi
          }
          check "npm test" npm test
          check "npm run lint" npm run lint
          check "npx tsc -b" npx tsc -b
          check "npm run build" npm run build
          (IFS=,; echo "{${results[*]}}") > "$RUNNER_TEMP/checks.json"
          echo "failed=$failed" >> "$GITHUB_OUTPUT"

      - name: Changelog and version
        if: steps.fix.outputs.changed == 'true'
        run: |
          node ../.github/scripts/deps-security.mjs changelog "$RUNNER_TEMP/before.json" "$RUNNER_TEMP/after.json"
          npm run version:bump -- patch --title "Dependency Security Updates"
          npx vitest run src/lib/__tests__/versionConsistency.test.ts

      - name: Open or update the pull request
        if: steps.fix.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.DEPS_PR_TOKEN }}
          FAILED: ${{ steps.checks.outputs.failed }}
        run: |
          node ../.github/scripts/deps-security.mjs body "$RUNNER_TEMP/before.json" "$RUNNER_TEMP/after.json" "$RUNNER_TEMP/checks.json" > "$RUNNER_TEMP/body.md"
          cat "$RUNNER_TEMP/body.md" >> "$GITHUB_STEP_SUMMARY"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add package.json package-lock.json ../CHANGELOG.md
          git commit -m "chore(deps): security updates" \
            -m "Made by the Dependency security workflow: npm audit fix within the version ranges, a patch bump and Security changelog bullets."
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$BRANCH"

          existing=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --body-file "$RUNNER_TEMP/body.md"
            if [ "$FAILED" = "true" ]; then gh pr ready "$existing" --undo || true; fi
            echo "Updated pull request #$existing." >> "$GITHUB_STEP_SUMMARY"
          else
            # The project's own counter (AGENTS.md): the highest SMS number in any pull request title, plus one.
            n=$(gh pr list --state all --search "SMS in:title" --limit 1000 --json title --jq '.[].title' \
              | grep -oE '^SMS-[0-9]+' | sed 's/^SMS-//' | sort -n | tail -1)
            next=$(printf "%03d" $(( 10#${n:-0} + 1 )))
            draft=()
            if [ "$FAILED" = "true" ]; then draft=(--draft); fi
            gh pr create --base main --head "$BRANCH" \
              --title "SMS-$next | Dependency Security Updates" \
              --body-file "$RUNNER_TEMP/body.md" "${draft[@]}"
            echo "Opened SMS-$next." >> "$GITHUB_STEP_SUMMARY"
          fi
